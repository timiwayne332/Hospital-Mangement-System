{% extends "layouts/base.html" %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-edit"></i> Edit Medicine</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="medicine_code" class="form-label">Medicine Code</label>
                            <input type="text" class="form-control" id="medicine_code" name="medicine_code" value="{{ medicine.medicine_code }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Medicine Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ medicine.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="generic_name" class="form-label">Generic Name</label>
                            <input type="text" class="form-control" id="generic_name" name="generic_name" value="{{ medicine.generic_name or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="manufacturer" class="form-label">Manufacturer</label>
                            <input type="text" class="form-control" id="manufacturer" name="manufacturer" value="{{ medicine.manufacturer or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="unit" class="form-label">Unit</label>
                            <input type="text" class="form-control" id="unit" name="unit" value="{{ medicine.unit or 'unit' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" min="0" value="{{ medicine.quantity }}">
                        </div>
                        <div class="col-md-4">
                            <label for="min_stock_level" class="form-label">Minimum Stock</label>
                            <input type="number" class="form-control" id="min_stock_level" name="min_stock_level" min="0" value="{{ medicine.min_stock_level }}">
                        </div>
                        <div class="col-md-6">
                            <label for="price_per_unit" class="form-label">Unit Price</label>
                            <input type="number" step="0.01" class="form-control" id="price_per_unit" name="price_per_unit" min="0" value="{{ medicine.price_per_unit }}">
                        </div>
                        <div class="col-md-6">
                            <label for="expiry_date" class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" id="expiry_date" name="expiry_date" value="{{ medicine.expiry_date.strftime('%Y-%m-%d') if medicine.expiry_date else '' }}">
                        </div>
                        <div class="col-md-12">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="is_available" name="is_available" {% if medicine.is_available %}checked{% endif %}>
                                <label class="form-check-label" for="is_available">Available for sale</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('pharmacy.inventory') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Medicine</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
